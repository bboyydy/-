name: Build Manager
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'manager/**'
      - 'kernel/**'
      - 'userspace/**'
permissions:
  contents: read
concurrency:
  group: lazhazi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-lkm:
    uses: ./.github/workflows/build-lkm.yml
  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml
  build-ksud:
    needs: [build-lkm, build-ksuinit]
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi]
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
  build-manager:
    needs: build-ksud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: ksud-*
          path: artifacts
      - name: Embed freshly built daemons
        shell: bash
        run: |
          set -euo pipefail
          for mapping in arm64-v8a:aarch64-linux-android x86_64:x86_64-linux-android armeabi-v7a:armv7-linux-androideabi; do
            abi=${mapping%%:*}
            target=${mapping#*:}
            mapfile -t files < <(find "artifacts/ksud-$target" -type f -name ksud)
            test "${#files[@]}" -eq 1
            test "$(stat -c %s "${files[0]}")" -gt 1000000
            mkdir -p "manager/app/src/main/jniLibs/$abi"
            cp "${files[0]}" "manager/app/src/main/jniLibs/$abi/libksud.so"
          done
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble release for local signing
        working-directory: manager
        run: ./gradlew assembleRelease -PKSU_PACKAGE_NAME=com.lazhazi.lazhazi -PKSU_NAME=拉闸仔
      - name: Check embedded daemons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apks = list(Path('manager/app/build/outputs/apk/release').glob('*.apk'))
          assert apks, 'No APK produced'
          for apk in apks:
              with zipfile.ZipFile(apk) as z:
                  libs = [n for n in z.namelist() if n.endswith('/libksud.so')]
                  assert libs, f'{apk}: missing ksud'
                  for name in libs:
                      abi = name.split('/')[1]
                      assert z.read(name) == Path(f'manager/app/src/main/jniLibs/{abi}/libksud.so').read_bytes()
              print(apk.name, 'embedded daemons verified')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: Lazhazi-Manager-for-local-signing
          path: manager/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Lazhazi-build-reports
          path: manager/build/reports/
          if-no-files-found: ignore
